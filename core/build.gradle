plugins { id 'java-library' }

// A small dependency-free suite; also runnable directly with the JDK.
tasks.register('foundationTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tiraaamisuuu.mineogenesis.core.FoundationTests'
}
tasks.named('test') { dependsOn foundationTest }

tasks.register('evolutionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tiraaamisuuu.mineogenesis.core.evolution.EvolutionTests'
}
tasks.named('test') { dependsOn evolutionTest }

tasks.register('acquisitionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.tiraaamisuuu.mineogenesis.core.acquisition.AcquisitionTests'
}
tasks.named('test') { dependsOn acquisitionTest }
