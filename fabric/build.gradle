plugins { id 'fabric-loom' version '1.7.4' }

base { archivesName = 'mineogenesis' }

loom {
    splitEnvironmentSourceSets()
    mods {
        mineogenesis {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    implementation project(':core')
    include project(':core')
}

// The integration-test mod is loaded only by this run, never packaged for users.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

loom {
    mods {
        'mineogenesis-test' { sourceSet sourceSets.gametest }
    }
    runs {
        gameTestServer {
            server()
            name 'Mineogenesis integration tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('test-results/gametest.xml').get().asFile}"
            runDir 'build/gametest'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.named('jar') {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_mineogenesis' } }
}
