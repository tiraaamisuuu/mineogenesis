name: Build and test
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build client and server sources; run core tests
        run: ./gradlew --no-daemon build
      - name: Run Minecraft server integration tests
        run: ./gradlew --no-daemon :fabric:runGameTestServer
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            core/build/reports/
            fabric/build/test-results/
            fabric/build/gametest/logs/
          if-no-files-found: ignore
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: mineogenesis-mod
          path: fabric/build/libs/mineogenesis-0.1.0.jar
